name: Keep-Alive

on:
  schedule:
    # Runs at 10:25 UTC on days 1, 6, 12, 18, 24, and 30 of every month.
    # Standard POSIX cron cannot track a true fixed interval across calendar month boundaries.
    # This schedule guarantees that elapsed time between runs never exceeds 6 days.
    - cron: '25 10 1,6,12,18,24,30 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send keep-alive ping to health endpoint
        env:
          APP_URL: ${{ vars.PRODUCTION_URL || secrets.PRODUCTION_URL || 'https://report-pilot-omega.vercel.app' }}
        run: |
          ENDPOINT="${APP_URL%/}/api/health"
          echo "Target Endpoint: $ENDPOINT"

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS --max-time 30 -w "%{http_code}" -o "$RESPONSE_FILE" "$ENDPOINT" || echo "000")

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat "$RESPONSE_FILE"
          echo ""

          SUCCESS_STATUS=false
          if jq -e '.success == true and .status == "healthy"' "$RESPONSE_FILE" >/dev/null 2>&1; then
            SUCCESS_STATUS=true
          elif grep -Eq '"success"[[:space:]]*:[[:space:]]*true' "$RESPONSE_FILE" 2>/dev/null && grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"' "$RESPONSE_FILE" 2>/dev/null; then
            SUCCESS_STATUS=true
          fi

          if [ "$HTTP_STATUS" = "200" ] && [ "$SUCCESS_STATUS" = "true" ]; then
            echo "Keep-alive check succeeded with HTTP 200 and healthy status."
            rm -f "$RESPONSE_FILE"
            exit 0
          else
            echo "Keep-alive check failed. Expected HTTP 200 with healthy status, received: $HTTP_STATUS"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi
